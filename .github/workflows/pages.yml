name: Deploy Plantea 3D to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check formatting
        run: npx --yes prettier@3.9.10 --check "dist/**/*.{mjs,js,css,html}" "worker/*.js" test.mjs test-recognize.mjs test-worker.mjs test-walk.mjs test-pro.mjs test-analytics.mjs test-interior.mjs
      - name: Verify JavaScript and geometry
        run: |
          for f in dist/*.mjs dist/ui/*.mjs dist/recognize/*.mjs worker/*.js; do node --check "$f"; done
          node test.mjs

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0
          python -m pip install -r backend/requirements.txt ruff==0.17.6
      - name: Check formatting
        run: ruff format --check backend preview.py
      - name: Run backend tests
        run: python -m unittest backend.test_backend -v

  # Upload and deployment run as separate jobs (GitHub's recommended layout): the
  # deploy job starts once the artifact is fully stored, which avoids "Fetching
  # artifact metadata failed" when both steps share a job.
  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test-js, test-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
