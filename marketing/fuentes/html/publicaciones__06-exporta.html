<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');
:root{--dark:#123b2a;--deep:#0d2c20;--green:#28866a;--mid:#2a7a55;--mint:#9fe0b8;--pale:#e8f2ed;--paper:#f6f8f7;--ink:#193f35;--muted:#5f7a6e;--sand:#cfb792}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--paper);overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand{font-family:Manrope,sans-serif;letter-spacing:-.02em}
.brand{display:flex;align-items:center;gap:.35em;font-weight:700}
.brand .mark{display:inline-block;width:1.05em;height:.72em;border:.12em solid currentColor;transform:skewX(-18deg);border-radius:.06em}
.brand b{font-weight:800;color:var(--green)}
.dark{background:linear-gradient(140deg,var(--deep),var(--mid));color:#fff}
.dark .brand b{color:var(--mint)}
.pill{display:inline-block;padding:.35em .9em;border-radius:99px;background:var(--pale);color:var(--green);font-weight:700;font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.dark .pill{background:rgba(255,255,255,.14);color:var(--mint)}
.img{background-size:cover;background-position:center;border-radius:22px}
.url{font-weight:600;letter-spacing:.01em}
.shadow{box-shadow:0 20px 60px rgba(13,44,32,.18)}
</style></head><body style="width:1080px;height:1080px">
    <div class="dark" style="width:1080px;height:1080px;padding:70px;display:flex;flex-direction:column">
      <div class="brand" style="font-size:34px"><span class="mark"></span><span>plano<b>vivo</b></span></div>
      <h1 style="font-size:66px;line-height:1.05;margin:40px 0 18px">Llévalo a tu<br>programa favorito</h1>
      <p style="font-size:28px;color:#d4f3e1">Plano Vivo no te encierra: exporta y sigue trabajando.</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:46px">
        <div style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:34px 26px">
              <div style="font:800 58px Manrope;color:var(--mint)">DXF</div><div style="font-size:24px;margin-top:8px;color:#eafff2">Plano para CAD</div></div><div style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:34px 26px">
              <div style="font:800 58px Manrope;color:var(--mint)">SVG</div><div style="font-size:24px;margin-top:8px;color:#eafff2">Plano vectorial</div></div><div style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:34px 26px">
              <div style="font:800 58px Manrope;color:var(--mint)">GLB</div><div style="font-size:24px;margin-top:8px;color:#eafff2">Modelo 3D</div></div><div style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:34px 26px">
              <div style="font:800 58px Manrope;color:var(--mint)">CSV</div><div style="font-size:24px;margin-top:8px;color:#eafff2">Cantidades</div></div><div style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:34px 26px">
              <div style="font:800 58px Manrope;color:var(--mint)">PNG</div><div style="font-size:24px;margin-top:8px;color:#eafff2">Imagen 3D</div></div><div style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:34px 26px">
              <div style="font:800 58px Manrope;color:var(--mint)">IFC</div><div style="font-size:24px;margin-top:8px;color:#eafff2">BIM · motor local</div></div>
      </div>
      <div style="margin-top:auto;display:flex;justify-content:space-between;font-size:26px"><span class="pill">Plano Vivo</span><span class="url">plano-vivo.fleremiasflemin.workers.dev</span></div>
    </div></body></html>
